name: Deploy Legal Pages

on:
  push:
    branches: [main, master]
    paths:
      - 'docs/legal/**'
      - '.github/workflows/deploy_legal_pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-legal-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload legal site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/legal

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
