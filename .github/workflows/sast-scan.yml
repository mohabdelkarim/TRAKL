name: SAST & Secret Scan

# Static analysis, secret detection, and IaC misconfiguration scanning.
# Combines Semgrep (SAST), TruffleHog (secrets), Checkov (IaC), and KICS (IaC).
# Results are uploaded to GitHub Security tab (SARIF).

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: sast-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep scan
        run: |
          semgrep scan \
            --config p/react-native \
            --config p/typescript \
            --config p/owasp-top-ten \
            --config p/security-audit \
            --config .semgrep.yml \
            --sarif --output semgrep.sarif \
            --error
        continue-on-error: true

      - name: Upload SARIF
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        continue-on-error: true
        with:
          sarif_file: semgrep.sarif

  trufflehog:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        id: trufflehog
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          path: ./
          base: ${{ github.event.before }}
          head: ${{ github.sha }}
          extra_args: --only-verified

  checkov:
    name: Checkov IaC Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run Checkov
        id: checkov
        uses: bridgecrewio/checkov-action@790ad7588e741a9db4599bb8b7067fb58590fbd6 # v2
        with:
          directory: .
          framework: github-actions,secrets
          output_format: sarif
          output_file: checkov-results.sarif
          soft_fail: true

      - name: Upload Checkov results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        if: always() && (github.event_name != 'pull_request' || github.event_pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        with:
          sarif_file: checkov-results.sarif

  kics:
    name: KICS IaC Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Prepare results directory
        run: mkdir -p kics-results

      - name: Run KICS Scan
        # Use the KICS image directly. checkmarx/kics-github-action@v2 always
        # apk-installs Alpine node after the scan and crashes with GLIBC_2.44.
        run: |
          docker run --rm \
            -v "$PWD":/src \
            -w /src \
            checkmarx/kics:v2.1.20 \
            scan -p . \
            -o kics-results \
            --report-formats json,sarif \
            --ignore-on-exit results \
            -e node_modules,.expo,dist,android,ios,.git,__tests__

      - name: Upload KICS results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        if: always() && (github.event_name != 'pull_request' || github.event_pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        with:
          sarif_file: kics-results/results.sarif

      - name: Upload KICS results as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: kics-results
          path: kics-results
          if-no-files-found: warn
          retention-days: 30
