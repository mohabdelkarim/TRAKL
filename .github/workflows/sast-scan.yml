name: SAST & Secret Scan

# Static analysis, secret detection, and IaC misconfiguration scanning.
# Combines Semgrep (SAST), TruffleHog (secrets), Checkov (IaC), and KICS (IaC).
# Results are uploaded to GitHub Security tab (SARIF).

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: sast-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep scan
        run: |
          semgrep scan \
            --config p/react-native \
            --config p/typescript \
            --config p/owasp-top-ten \
            --config p/security-audit \
            --config .semgrep.yml \
            --sarif --output semgrep.sarif \
            --error
        continue-on-error: true

      - name: Upload SARIF
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: semgrep.sarif

  trufflehog:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        id: trufflehog
        uses: trufflesecurity/trufflehog@v3.96.0
        continue-on-error: true
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  checkov:
    name: Checkov IaC Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Checkov
        id: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: github-actions,secrets
          output_format: sarif
          output_file: checkov-results.sarif
          soft_fail: true

      - name: Upload Checkov results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always() && (github.event_name != 'pull_request' || github.event_pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        with:
          sarif_file: checkov-results.sarif

  kics:
    name: KICS IaC Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare results directory
        run: mkdir -p kics-results

      - name: Run KICS Scan
        uses: checkmarx/kics-github-action@v2
        with:
          path: .
          output_path: kics-results
          output_formats: json,sarif
          ignore_on_exit: results
          exclude_paths: 'node_modules,.expo,dist,android,ios,.git,__tests__'
          fail_on: ''

      - name: Upload KICS results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always() && (github.event_name != 'pull_request' || github.event_pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        with:
          sarif_file: kics-results/results.sarif

      - name: Upload KICS results as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kics-results
          path: kics-results
          if-no-files-found: warn
          retention-days: 30
